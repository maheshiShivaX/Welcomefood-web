<div class="storeentryform">
    <div class="store-heading">
        <h4 class="">Comapany Profile   
            
            <button type="button" title="Edit" class="editbtn" (click)="openPopup('Edit')" style="float: right;">

                <path d="M11.05 3.00002L4.20829 10.2417C3.94996 10.5167 3.69996 11.0584 3.64996 11.4334L3.34162 14.1334C3.23329 15.1084 3.93329 15.775 4.89996 15.6084L7.58329 15.15C7.95829 15.0834 8.48329 14.8084 8.74162 14.525L15.5833 7.28335C16.7666 6.03335 17.3 4.60835 15.4583 2.86668C13.625 1.14168 12.2333 1.75002 11.05 3.00002Z" stroke="#023088" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.9082 4.2085C10.2665 6.5085 12.1332 8.26683 14.4499 8.50016" stroke="#023088" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2.5 18.3335H17.5" stroke="#023088" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                </svg> 
        </button>
    </h4>
    </div>
    <div class="storeformdata pt-2 col-12" *ngIf="companyProfile !=null">
        <div class="row"    >
            <div class="mb-3 col-xl-6 col-lg-6">
                <label for="FormControlInput1" class="form-label"><b>Company Name</b></label> : 
                <label for="FormControlInput1" class="form-label">{{companyProfile[0].comapnyName}}</label>
               
            </div>
            <div class="mb-3 col-xl-6 col-lg-6">
                <label for="FormControlInput1" class="form-label"><b>Address</b></label> : 
                <label for="FormControlInput1" class="form-label">{{companyProfile[0].address}}</label>
                
            </div>
            <div class="mb-3 col-xl-6 col-lg-6">
                <label for="FormControlInput1" class="form-label"><b>Email Id</b></label> :
                <label for="FormControlInput1" class="form-label">{{companyProfile[0].emailid}}</label>
              
            </div>
            <div class="mb-3 col-xl-6 col-lg-6">
                <label for="FormControlInput1" class="form-label"><b>Mobile No</b></label> :
                <label for="FormControlInput1" class="form-label">{{companyProfile[0].contactNo}}</label>
               
            </div>
           
        </div>
    </div>
</div>

        </div>

</div>


<div id="productpopupContainer" class="termspopup-container">
    <div class="cross-button">
        <span class="" (click)="closePopup()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.75735 7.75757L16.2426 16.2428" stroke="#080433" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
            <path d="M7.75736 16.2428L16.2426 7.75757" stroke="#080433" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </span>
    </div>

    
    <form [formGroup]="form" class="row" (submit)="onSubmit()">
        
        <div class="mb-3 col-12">
            <label for="FormControlInput1" class="form-label">Company Name</label>
            <input type="text" class="form-control" formControlName="comapnyName" id="FormControlInput1"
                placeholder="Enter Company Name">
            
        </div>
        <div class="mb-3 col-12">
            <label for="FormControlInput1" class="form-label">Email Id</label>
            <input type="text" class="form-control" formControlName="emailid" id="FormControlInput1"
                placeholder="Enter Email Id">
            
        </div>

        <div class="mb-3 col-12">
            <label for="FormControlInput1" class="form-label">Mobile No</label>
            <input type="text" class="form-control" formControlName="contactNo" id="FormControlInput1"
                placeholder="Enter Mobile No">
          
        </div>

        <div class="mb-3 col-12">
            <label for="FormControlInput1" class="form-label">Address</label>
            <input type="text" class="form-control" formControlName="address" id="FormControlInput1"
                placeholder="Enter Address">
          
        </div>

       
        <div class="submit-btn col-12 d-flex justify-content-sm-end justify-content-between">
            <!-- <div class="resetbtn">
                <button (click)="onReset()" [disabled]="form.invalid" type="button">
                    Reset
                </button>
            </div> -->
            <div class="savebtn">
                <button type="submit" [disabled]="isLoading" (click)="closePopup()">
                    <ng-container *ngIf="!isLoading">Save</ng-container>
                    <ng-container *ngIf="isLoading">
                        <span clas="indicator-progress" [style.display]="'block'">
                            Please wait...
                            <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                        </span>
                    </ng-container>
                </button>
            </div>
        </div>
    </form>
</div>
